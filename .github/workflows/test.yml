name: Backend Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: SQLite (fast, always runs) ────────────────────────────────────────
  test-sqlite:
    name: pytest / SQLite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests (SQLite)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: test-secret-key-minimum-32-bytes-long!!
          JWT_SECRET_KEY: test-jwt-secret-minimum-32-bytes-long!!
          FLASK_ENV: testing
        run: |
          python -m pytest tests/ \
            --tb=short -q --no-header -p no:warnings

  # ── Job 2: MySQL (matches production) ────────────────────────────────────────
  test-mysql:
    name: pytest / MySQL 8
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: orionlead_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root -ptestpass --silent; do
            echo "Waiting for MySQL..."; sleep 2
          done

      - name: Run tests (MySQL)
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://testuser:testpass@127.0.0.1:3306/orionlead_test
          SECRET_KEY: test-secret-key-minimum-32-bytes-long!!
          JWT_SECRET_KEY: test-jwt-secret-minimum-32-bytes-long!!
          FLASK_ENV: testing
        run: |
          python -m pytest tests/ \
            --tb=short -q --no-header -p no:warnings

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-test-results
          path: backend/.pytest_cache
          retention-days: 7
