# Prometheus Configuration for OrionLead AI
# Place this file at monitoring/prometheus.yml
# Run: ./prometheus --config.file=monitoring/prometheus.yml

global:
  scrape_interval: 15s       # How often to scrape targets
  evaluation_interval: 15s   # How often to evaluate rules
  external_labels:
    monitor: "ai-lead-system"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093  # AlertManager default port

# Load rules once and periodically evaluate them
rule_files:
  - "alert-rules.yml"

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 5s

  # Scrape the AI Lead System Flask app
  - job_name: "ai-lead-system"
    static_configs:
      - targets: ["localhost:5000"]
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s
    scheme: "http"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: scheme
    metric_relabel_configs:
      # Drop high-cardinality metrics if needed
      # - source_labels: [__name__]
      #   regex: 'http_requests_total'
      #   action: drop

  # If running backend services
  - job_name: "backend-api"
    static_configs:
      - targets: ["localhost:5000"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  # If running task queue (Celery)
  - job_name: "celery-worker"
    static_configs:
      - targets: ["localhost:5555"]  # Flower metrics endpoint
    metrics_path: "/metrics"
    scrape_interval: 30s

  # Node Exporter - for system-level metrics
  - job_name: "node"
    static_configs:
      - targets: ["localhost:9100"]
    scrape_interval: 15s

# Remote storage configurations (optional)
# Uncomment to send metrics to remote storage
# remote_write:
#   - url: "http://remote-prometheus-server:9009/api/v1/write"

# remote_read:
#   - url: "http://remote-prometheus-server:9009/api/v1/read"

# Storage configurations are passed as command-line flags
# Example: --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d
