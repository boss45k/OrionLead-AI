<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Rounded background with brand gradient -->
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <!-- Subtle top highlight -->
  <rect x="0" y="0" width="32" height="14" rx="7" fill="white" fill-opacity="0.06"/>
  <!-- Constellation lines -->
  <line x1="16" y1="10" x2="9" y2="22" stroke="white" stroke-width="1.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="16" y1="10" x2="23" y2="22" stroke="white" stroke-width="1.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="9.5" y1="24.5" x2="22.5" y2="24.5" stroke="white" stroke-width="1.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <!-- Top node (brightest — the "O" in Orion) -->
  <circle cx="16" cy="8.5" r="3.5" fill="white"/>
  <!-- Bottom nodes -->
  <circle cx="9" cy="24.5" r="2.8" fill="white" fill-opacity="0.92"/>
  <circle cx="23" cy="24.5" r="2.8" fill="white" fill-opacity="0.92"/>
</svg>
